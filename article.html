<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="icon" href="assets/favicon.png">
  <link rel="stylesheet" href="_ds/nexura-design-system-19251d3b-6029-4068-a5c5-a67a7d870366/styles.css">
  <script src="_ds/nexura-design-system-19251d3b-6029-4068-a5c5-a67a7d870366/_ds_bundle.js"></script>
  <script src="site-motion.js"></script>
  <style>body{margin:0;overflow-x:clip;background:#fff;color:#000;font-family:var(--font-sans);font-feature-settings:var(--font-features);-webkit-font-smoothing:antialiased}a{color:inherit}a:hover{color:var(--blue-ink)}:focus-visible{outline:2px solid #517ffc;outline-offset:3px}@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}</style>
</helmet>
<dc-import name="site-header" current="company" hint-size="100%,73px"></dc-import>
<main id="main" style="max-width:1290px;margin:0 auto;border-left:1px dashed var(--grey-300);border-right:1px dashed var(--grey-300);box-sizing:border-box;min-height:60vh">
  <sc-if value="{{ missing }}" hint-placeholder-val="{{ false }}">
    <section aria-labelledby="h1" style="background-color:#fff;background-image:radial-gradient(ellipse 50% 50% at 50% 50%,#fff 18%,rgba(255,255,255,0) 100%),radial-gradient(rgba(0,0,0,.08) 1px,transparent 1.3px);background-size:100% 100%,24px 24px;padding:clamp(64px,9vw,112px) clamp(20px,5vw,64px);display:flex;flex-direction:column;align-items:flex-start;gap:20px">
      <h1 id="h1" style="margin:0;font:500 clamp(36px,5vw,54px)/1.1 var(--font-sans);letter-spacing:-0.045em">We couldn't find that article.</h1>
      <x-import component-from-global-scope="NexuraDesignSystem_19251d.Button" href="/insights" hint-size="140px,44px">See all insights</x-import>
    </section>
  </sc-if>
  <sc-if value="{{ ready }}" hint-placeholder-val="{{ false }}">
    <article aria-labelledby="h1">
      <header style="background-color:#fff;background-image:radial-gradient(ellipse 50% 50% at 50% 50%,#fff 18%,rgba(255,255,255,0) 100%),radial-gradient(rgba(0,0,0,.08) 1px,transparent 1.3px);background-size:100% 100%,24px 24px;padding:clamp(64px,9vw,112px) clamp(20px,5vw,64px) clamp(32px,4vw,48px);display:flex;flex-direction:column;align-items:flex-start;gap:20px">
        <a href="/insights" style="font:500 14px/1.4 var(--font-sans);color:var(--grey-700);text-decoration:none;min-height:32px;display:inline-flex;align-items:center">← Insights</a>
        <h1 id="h1" style="margin:0;max-width:900px;font:500 clamp(38px,5.6vw,60px)/1.08 var(--font-sans);letter-spacing:-0.045em;text-wrap:balance">{{ a.title }}</h1>
        <p style="margin:0;max-width:760px;font:400 clamp(19px,2vw,23px)/1.45 var(--font-sans);letter-spacing:-0.03em;color:var(--grey-700);text-wrap:pretty">{{ a.standfirst }}</p>
        <p style="margin:0;font:500 14px/1.4 var(--font-sans)">By Propel</p>
      </header>
      <div aria-hidden="true" style="padding:0 clamp(20px,5vw,64px) clamp(40px,5vw,64px);background:#fff"><div style="max-width:1000px;margin:0 auto;overflow:hidden;background:var(--grey-100)"><sc-if value="{{ coverSrc }}" hint-placeholder-val="{{ false }}"><img data-src="{{ coverSrc }}" alt="" width="1448" height="1086" decoding="async" style="display:block;width:100%;height:auto"></sc-if></div></div>
      <div style="border-top:1px dashed var(--grey-300);padding:clamp(40px,5vw,64px) clamp(20px,5vw,64px);display:flex;flex-direction:column;gap:18px;max-width:760px">
        <sc-for list="{{ a.intro }}" as="p"><p style="margin:0;font:400 18px/1.65 var(--font-sans);letter-spacing:-0.015em">{{ p }}</p></sc-for>
      </div>
      <figure style="margin:0;border-top:1px dashed var(--grey-300);padding:clamp(40px,5vw,64px) clamp(20px,5vw,64px);background:var(--grey-50);display:flex;flex-direction:column;gap:20px">
        <figcaption style="display:flex;flex-wrap:wrap;gap:10px;align-items:center"><span style="font:500 18px/1.3 var(--font-sans);letter-spacing:-0.04em">{{ a.diagram.title }}</span><span style="padding:4px 10px;border-radius:100px;background:#fff;border:1px solid var(--grey-300);font:500 12px/1.4 var(--font-sans)">Planning framework</span></figcaption>
        <ol style="list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:2px">
          <sc-for list="{{ dsteps }}" as="d">
            <li style="background:{{ d.bg }};color:{{ d.fg }};padding:22px;display:flex;flex-direction:column;gap:18px;min-height:120px">
              <span style="font:500 13px/1 var(--font-numeric);opacity:.75">{{ d.n }}</span>
              <span style="font:500 19px/1.3 var(--font-sans);letter-spacing:-0.04em">{{ d.t }}</span>
              <span aria-hidden="true" style="margin-top:auto;font:400 18px/1 var(--font-sans);opacity:.6">{{ d.arrow }}</span>
            </li>
          </sc-for>
        </ol>
        <sc-if value="{{ hasLimits }}">
          <div style="display:flex;gap:14px;padding:18px 20px;background:#fff;border:1px solid var(--grey-300)"><span style="flex:none;font:500 14px/1.5 var(--font-sans)">Research limits</span><p style="margin:0;font:400 15px/1.5 var(--font-sans);color:var(--grey-700)">{{ a.diagram.limits }}</p></div>
        </sc-if>
      </figure>
      <sc-for list="{{ a.sections }}" as="sec">
        <section style="border-top:1px dashed var(--grey-300);padding:clamp(40px,5vw,64px) clamp(20px,5vw,64px);display:flex;flex-direction:column;gap:18px;max-width:760px">
          <h2 style="margin:0;font:500 clamp(24px,3vw,30px)/1.25 var(--font-sans);letter-spacing:-0.04em">{{ sec.h }}</h2>
          <sc-for list="{{ sec.ps }}" as="p"><p style="margin:0;font:400 18px/1.65 var(--font-sans);letter-spacing:-0.015em">{{ p }}</p></sc-for>
        </section>
      </sc-for>
    </article>
    <div style="background:#fff;overflow:hidden">
    <section aria-label="Next steps" style="position:relative;z-index:1;border-top:1px dashed var(--grey-300);padding:clamp(56px,7vw,88px) clamp(20px,5vw,64px);display:flex;flex-wrap:wrap;gap:32px 64px;align-items:flex-end;justify-content:space-between">
    <div aria-hidden="true" style="position:absolute;inset:0;z-index:-1;pointer-events:none;background-image:linear-gradient(rgba(0,0,0,.018) 2px,transparent 2px),linear-gradient(90deg,rgba(0,0,0,.018) 2px,transparent 2px);background-size:48px 48px;background-position:center top;-webkit-mask-image:radial-gradient(ellipse 75% 90% at 50% 40%,#000 10%,transparent 80%);mask-image:radial-gradient(ellipse 75% 90% at 50% 40%,#000 10%,transparent 80%)"></div>
      <x-import component-from-global-scope="NexuraDesignSystem_19251d.Button" href="{{ ctaHref }}" hint-size="240px,44px">{{ a.cta.label }}</x-import>
      <nav aria-label="Related" style="flex:0 1 420px;display:flex;flex-direction:column;gap:4px">
        <p style="margin:0 0 4px;font:500 13px/1.4 var(--font-sans);color:var(--grey-700)">{{ relatedLabel }}</p>
        <sc-for list="{{ a.related }}" as="r">
          <a href="{{ r.href }}" style="display:flex;align-items:center;gap:14px;min-height:52px;padding:10px 0;border-top:1px dashed var(--grey-300);font:500 17px/1.3 var(--font-sans);letter-spacing:-0.03em;text-decoration:none"><sc-if value="{{ r.thumb }}"><img data-src="{{ r.thumb }}" alt="" width="1448" height="1086" loading="lazy" style="width:88px;height:66px;object-fit:cover;flex:none"></sc-if><span style="flex:1">{{ r.name }}</span><span aria-hidden="true">→</span></a>
        </sc-for>
      </nav>
    </section>
    <sc-if value="{{ closeSrc }}" hint-placeholder-val="{{ false }}"><img aria-hidden="true" data-src="{{ closeSrc }}" alt="" width="1916" height="821" loading="lazy" decoding="async" style="display:block;width:100%;height:auto;margin-top:calc(-1 * clamp(40px,11vw,150px));pointer-events:none;user-select:none;position:relative"></sc-if>
    </div>
  </sc-if>
</main>
<dc-import name="site-footer" hint-size="100%,420px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { a: null, missing: false };
  componentDidMount() {
    document.title = 'Insights | Propel';
    const id = new URLSearchParams(location.search).get('id');
    import(new URL('site-data.js', location.href).href).then(m => {
      const a = m.ARTICLES.find(x => x.id === id);
      if (!a) { this.setState({ missing: true }); document.title = 'Article not found | Propel'; return; }
      document.title = a.pageTitle;
      this.setState({ a });
    }).catch(() => this.setState({ missing: true }));
  }
  componentDidUpdate() {
    document.querySelectorAll('img[data-src]').forEach(i => { const s = i.getAttribute('data-src'); if (s && s.indexOf('{') < 0 && i.getAttribute('src') !== s) i.setAttribute('src', s); });
    const x = this.state.a;
    if (x && document.title !== x.pageTitle) document.title = x.pageTitle;
  }
  renderVals() {
    const a = this.state.a;
    if (!a) return { coverSrc: '', closeSrc: '', ready: false, missing: this.state.missing, a: { diagram: {}, cta: {} } };
    const st = a.diagram.steps;
    return {
      ready: true, missing: false, a: Object.assign({}, a, { related: a.related.map(r => { const m = /article\.dc\.html\?id=([\w-]+)/.exec(r.href); return Object.assign({}, r, { thumb: m ? 'assets/propel-insights-' + m[1] + '-cover.webp' : '' }); }) }), coverSrc: 'assets/propel-insights-' + a.id + '-cover.webp', closeSrc: 'assets/propel-insights-' + a.id + '-closing.webp',
      dsteps: st.map((t, i) => { const last = i === st.length - 1; return { t, n: '0' + (i + 1), bg: last ? '#000' : '#fff', fg: last ? '#fff' : '#000', arrow: last ? (a.diagram.loop ? '↺ back to the start' : '') : '→' }; }),
      hasLimits: !!a.diagram.limits,
      ctaHref: '/contact' + (a.cta.topic ? '?topic=' + encodeURIComponent(a.cta.topic) : ''),
      relatedLabel: a.related.length > 1 ? 'Related stories' : 'Related article'
    };
  }
}
</script>
</body>
</html>
