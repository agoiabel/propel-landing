<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="background:{{ bg }};color:{{ fg }};padding:24px;display:flex;flex-direction:column-reverse;justify-content:flex-end;gap:8px">
  <dt style="font:400 15px/1.45 var(--font-sans);color:{{ sub }}">{{ label }}</dt>
  <dd style="margin:0;color:{{ num }};font:500 {{ size }}px/1.05 var(--font-numeric);letter-spacing:-0.04em">{{ value }}</dd>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;260px&quot;,&quot;height&quot;:&quot;140px&quot;},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;professionals in the ecosystem&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;value&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;1M+&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;dark&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:44,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props, dark = p.dark === true || p.dark === 'true';
    return { label: p.label, value: p.value, size: p.size || 44, bg: dark ? '#0a0a0a' : '#fff', fg: dark ? '#fff' : '#000', num: dark ? '#8fb0ff' : '#1b4fd8', sub: dark ? 'rgba(255,255,255,.78)' : 'var(--grey-700)' };
  }
}
</script>
</body>
</html>
